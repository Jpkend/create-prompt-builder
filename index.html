<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CREATE Prompt Builder</title>
<style>
    body {
        font-family: 'Helvetica Neue', Arial, sans-serif;
        background-color: #FFFFFF;
        margin: 0;
        padding: 20px;
    }
    .app-container {
    max-width: 1000px;
    margin: 0 auto;
    padding: 30px;
    border: none;
    background-color: #FFFFFF;
    }
    .header-title {
        color: #000054;
        text-align: center;
        margin-top: 0;
        font-family: 'Museo', Arial, sans-serif;
        font-weight: 700;
        font-size: 28px;
    }
    .header-desc {
        font-size: 14px;
        color: #000000;
        text-align: center;
        margin-bottom: 25px;
    }
    .grid-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-bottom: 20px;
    }
    .input-group label {
        display: block;
        font-weight: bold;
        color: #000000;
        font-size: 14px;
        margin-bottom: 5px;
    }
    .input-group label span {
        font-weight: normal;
        color: #000054;
    }
    .input-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #E3E5E0;
        border-radius: 0;
        resize: vertical;
        font-family: inherit;
        box-sizing: border-box;
    }
    .button-group {
        text-align: left;
        margin-top: 10px;
    }
    .btn-primary {
        padding: 12px 24px;
        background-color: #E61E2A;
        color: #FFFFFF;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        font-family: inherit;
    }
    .btn-secondary {
        padding: 12px 24px;
        background-color: #E3E5E0;
        color: #000054;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        font-family: inherit;
        margin-left: 10px;
    }
    .btn-copy {
        padding: 12px 24px;
        background-color: #000054;
        color: #FFFFFF;
        border: none;
        cursor: pointer;
        font-weight: bold;
        font-size: 14px;
        font-family: inherit;
    }
    .output-section {
        margin-top: 30px;
        border-top: 4px solid #000054;
        padding-top: 20px;
    }
    .output-textarea {
        width: 100%;
        margin-top: 10px;
        margin-bottom: 15px;
        padding: 12px;
        border: 1px solid #000054;
        background-color: #FAFAFA;
        font-family: monospace;
        font-size: 14px;
        color: #000000;
        box-sizing: border-box;
    }
    
    /* Responsive fallback for smaller screens */
    @media (max-width: 768px) {
        .grid-container {
            grid-template-columns: 1fr;
        }
    }
</style>
</head>
<body>

<div class="app-container">
    <h2 class="header-title">CREATE Prompt Builder</h2>
    <p class="header-desc">Fill in the elements below to engineer a precise, targeted AI prompt.</p>

    <!-- 2-Column Form Layout -->
    <div class="grid-container">
        <!-- Left Column -->
        <div>
            <div class="input-group">
                <label>C - Character <span>(What role should the AI play?)</span></label>
                <textarea id="c-input" rows="3" placeholder="e.g., Act as an English language tutor."></textarea>
            </div>
            <div class="input-group">
                <label>R - Request <span>(What specifically do you want it to do?)</span></label>
                <textarea id="r-input" rows="3" placeholder="e.g., Help me practice using English past, present, and future tenses."></textarea>
            </div>
            <div class="input-group">
                <label>E - Examples <span>(Give a detail or context to guide it)</span></label>
                <textarea id="e-input" rows="3" placeholder="e.g., Give a clear example sentence for each tense to show how it is used."></textarea>
            </div>
        </div>
        
        <!-- Right Column -->
        <div>
            <div class="input-group">
                <label>A - Adjustments <span>(What rules must it follow?)</span></label>
                <textarea id="a-input" rows="3" placeholder="e.g., Make sure all writing, vocabulary, and grammar remain at or below a B2 reading level."></textarea>
            </div>
            <div class="input-group">
                <label>T - Type of output <span>(How should the final answer look?)</span></label>
                <textarea id="t-input" rows="3" placeholder="e.g., Give basic explanations followed by a short set of quiz-style practice questions (e.g., fill-in-the-blank or multiple choice)."></textarea>
            </div>
            <div class="input-group">
                <label>E - Extras <span>(Are there are any extra instructions?)</span></label>
                <textarea id="ex-input" rows="3" placeholder="e.g., Finish by asking if I need more support or additional questions."></textarea>
            </div>
        </div>
    </div>

    <!-- Action Buttons -->
    <div class="button-group">
        <button class="btn-primary" onclick="generatePrompt()">Generate Prompt</button>
        <button class="btn-secondary" onclick="clearFields()">Clear Fields</button>
    </div>

    <!-- Output Section -->
    <div class="output-section">
        <label style="font-weight: bold; color: #000054; font-size: 16px;">Your Completed Prompt:</label>
        <textarea id="final-output" class="output-textarea" rows="10" readonly></textarea>
        
        <button id="copy-btn" class="btn-copy" onclick="copyToClipboard()">Copy to Clipboard</button>
        <span id="copy-status" style="margin-left: 15px; color: #E61E2A; font-weight: bold; display: none;">Copied!</span>
    </div>
</div>

<script>
    function generatePrompt() {
        const c = document.getElementById('c-input').value.trim();
        const r = document.getElementById('r-input').value.trim();
        const e = document.getElementById('e-input').value.trim();
        const a = document.getElementById('a-input').value.trim();
        const t = document.getElementById('t-input').value.trim();
        const ex = document.getElementById('ex-input').value.trim();

        let finalPrompt = [];

        if (c) finalPrompt.push(`${c}\n`);
        if (r) finalPrompt.push(`**Task:**\n${r}`);
        if (e) finalPrompt.push(`**Context & Examples:**\n- ${e}`);
        if (a) finalPrompt.push(`**Constraints:**\n- ${a}`);
        if (t) finalPrompt.push(`**Output Format:**\n- ${t}`);
        if (ex) finalPrompt.push(`**Additional Instructions:**\n- ${ex}`);

        document.getElementById('final-output').value = finalPrompt.join('\n\n');
        document.getElementById('copy-status').style.display = 'none';
        document.getElementById('copy-btn').innerText = 'Copy to Clipboard';
    }

    function copyToClipboard() {
        const outputArea = document.getElementById('final-output');
        if (outputArea.value.trim() === '') {
            alert('Please generate a prompt first.');
            return;
        }
        outputArea.select();
        outputArea.setSelectionRange(0, 99999); 
        navigator.clipboard.writeText(outputArea.value).then(() => {
            const statusLabel = document.getElementById('copy-status');
            const copyBtn = document.getElementById('copy-btn');
            statusLabel.style.display = 'inline';
            copyBtn.innerText = 'Copied!';
            setTimeout(() => {
                statusLabel.style.display = 'none';
                copyBtn.innerText = 'Copy to Clipboard';
            }, 2500);
        }).catch(err => {
            console.error('Failed to copy text: ', err);
            alert('Failed to copy text. You can manually copy it from the text box.');
        });
    }

    function clearFields() {
        document.getElementById('c-input').value = '';
        document.getElementById('r-input').value = '';
        document.getElementById('e-input').value = '';
        document.getElementById('a-input').value = '';
        document.getElementById('t-input').value = '';
        document.getElementById('ex-input').value = '';
        document.getElementById('final-output').value = '';
        document.getElementById('copy-status').style.display = 'none';
        document.getElementById('copy-btn').innerText = 'Copy to Clipboard';
    }
</script>
</body>
</html>
